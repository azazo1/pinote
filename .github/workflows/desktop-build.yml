name: Desktop build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag, 留空时只构建并上传 artifact, 不创建 release"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: 解析并校验版本
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      is_release: ${{ steps.release_context.outputs.is_release }}
      tag_name: ${{ steps.release_context.outputs.tag_name }}
      source_ref: ${{ steps.release_context.outputs.source_ref }}
      version: ${{ steps.release_version.outputs.version }}
      build_version: ${{ steps.build_version.outputs.build_version }}
    steps:
      - name: 解析发布上下文
        id: release_context
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          is_release=false
          tag_name=""
          source_ref="$CURRENT_SHA"

          if [[ "$EVENT_NAME" == "push" && "$CURRENT_REF" == refs/tags/* ]]; then
            is_release=true
            tag_name="$CURRENT_REF_NAME"
            source_ref="$CURRENT_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_TAG" ]]; then
            git check-ref-format "refs/tags/$DISPATCH_TAG"
            is_release=true
            tag_name="$DISPATCH_TAG"
            source_ref="refs/tags/$DISPATCH_TAG"
          fi

          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: 检出目标提交
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_context.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 校验发布版本
        id: release_version
        if: steps.release_context.outputs.is_release == 'true'
        env:
          TAG_NAME: ${{ steps.release_context.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(jq -er '.version' package.json)"
          case "$package_version" in
            v*)
              echo "package.json 的 version 不应带 v 前缀: $package_version" >&2
              exit 1
              ;;
          esac

          if [[ "$TAG_NAME" != "v$package_version" ]]; then
            echo "tag $TAG_NAME 与 package.json 的版本 $package_version 不一致" >&2
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: 解析构建版本
        id: build_version
        env:
          IS_RELEASE: ${{ steps.release_context.outputs.is_release }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "build_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "build_version=$(bash scripts/build-version.sh)" >> "$GITHUB_OUTPUT"

  test:
    name: 单元测试
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出目标提交
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 恢复 bun 依赖缓存
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-x86_64-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 运行单元测试
        run: bun run test

  build:
    name: 打包 ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            platform: macos
            arch: x86_64
            os: macos-15-intel
          - name: macOS aarch64
            platform: macos
            arch: aarch64
            os: macos-15
          - name: Windows x86_64
            platform: windows
            arch: x86_64
            os: windows-2025
          - name: Windows aarch64
            platform: windows
            arch: aarch64
            os: windows-11-arm
          - name: Linux x86_64
            platform: linux
            arch: x86_64
            os: ubuntu-24.04
          - name: Linux aarch64
            platform: linux
            arch: aarch64
            os: ubuntu-24.04-arm
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: 检出目标提交
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 恢复 bun 依赖缓存
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 安装 just
        uses: extractions/setup-just@v4

      - name: 打包平台产物
        env:
          PROJECT_BUILD_VERSION: v${{ needs.version.outputs.build_version }}
          PROJECT_DIST_ARCH: ${{ matrix.arch }}
        run: just dist

      - name: 校验 dmg 包含 Applications 替身与应用包
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)

          if (( ${#dmgs[@]} != 1 )); then
            echo "预期 1 个 dmg, 实际找到 ${#dmgs[@]} 个" >&2
            exit 1
          fi

          dmg="${dmgs[0]}"
          mount_point="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT

          test -L "$mount_point/Applications"
          test "$(readlink "$mount_point/Applications")" = "/Applications"
          test -d "$mount_point/Pinote.app"
          test -x "$mount_point/Pinote.app/Contents/MacOS/Pinote"

      - name: 上传平台产物
        uses: actions/upload-artifact@v4
        with:
          name: pinote-${{ needs.version.outputs.build_version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 GitHub Release
    if: needs.version.outputs.is_release == 'true'
    needs: [version, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 检出发布 tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: pinote-*
          path: release-artifacts
          merge-multiple: true

      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-artifacts
          archives=(pinote-*.tar.gz pinote-*.zip pinote-*.dmg)

          if (( ${#archives[@]} != 6 )); then
            echo "预期 6 个归档, 实际找到 ${#archives[@]} 个" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi

          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: 重新获取 annotated tag object
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG_NAME"
          git fetch --force origin \
            "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

      - name: 校验 tag annotation 与发布说明一致
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG_NAME"
          manual_notes="docs/changelog/$VERSION.md"

          if [[ ! -s "$manual_notes" ]]; then
            echo "缺少 release notes: $manual_notes" >&2
            exit 1
          fi

          tag_type="$(git cat-file -t "$tag_ref")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "发布 tag 必须是 annotated tag: $TAG_NAME" >&2
            exit 1
          fi

          git cat-file tag "$tag_ref" | sed '1,/^$/d' > tag-notes.md
          if ! grep -q '[^[:space:]]' tag-notes.md; then
            echo "发布 tag 的 annotation 不能为空: $TAG_NAME" >&2
            exit 1
          fi

          if ! cmp -s "$manual_notes" tag-notes.md; then
            echo "发布 tag 的 annotation 与 $manual_notes 不一致" >&2
            diff -u "$manual_notes" tag-notes.md || true
            exit 1
          fi

      - name: 生成 release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          manual_notes="docs/changelog/$VERSION.md"
          base_tag_file="docs/changelog/$VERSION-base.txt"
          api_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$TAG_NAME"
          )

          target_sha="$(git rev-parse HEAD)"
          api_args+=(-f "target_commitish=$target_sha")

          if [[ -s "$base_tag_file" ]]; then
            base_tag="$(<"$base_tag_file")"
            git check-ref-format "refs/tags/$base_tag"
            api_args+=(-f "previous_tag_name=$base_tag")
          fi

          gh api "${api_args[@]}" --jq '.body' > generated-notes.md
          cp "$manual_notes" release-notes.md

          if [[ -s generated-notes.md ]]; then
            printf '\n---\n\n' >> release-notes.md
            cat generated-notes.md >> release-notes.md
          fi

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release-artifacts/pinote-*.tar.gz
            release-artifacts/pinote-*.zip
            release-artifacts/pinote-*.dmg
            release-artifacts/SHA256SUMS
          )

          if (( ${#assets[@]} != 7 )); then
            echo "预期 7 个发布文件, 实际找到 ${#assets[@]} 个" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi

          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --verify-tag \
              --title "Pinote v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "Pinote v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
